name: Frontend E2E

on:
  workflow_dispatch:
    inputs:
      counterpart_sha:
        description: Optional operator-selected backend full lowercase 40-character SHA (never a branch or tag)
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    env:
      TRANXIT_BACKEND_DIR: ${{ github.workspace }}/TranXIT-Backend/TranXit
      TRANXIT_E2E_FRONTEND_PORT: "3100"
      TRANXIT_E2E_GATEWAY_PORT: "18188"
      TRANXIT_E2E_SQL_PORT: "11488"
      TRANXIT_E2E_RABBITMQ_PORT: "25688"
      TRANXIT_E2E_RABBITMQ_MANAGEMENT_PORT: "25689"
      TRANXIT_E2E_PROJECT_NAME: tranxit-e2e-ci
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TRANXIT_API_URL: http://127.0.0.1:18188
      TRANXIT_API_URL: http://127.0.0.1:18188
      TRANXIT_E2E_EXPOSE_DEV_CODE: "true"
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check immutable pairing contracts
        run: node --test .github/scripts/ci-pair.test.mjs

      - name: Validate and resolve immutable backend selection
        id: backend-ref
        env:
          COUNTERPART_SHA: ${{ inputs.counterpart_sha || '' }}
        run: node .github/scripts/ci-pair.mjs resolve .github/ci-pair.json makewaysdotnet/TranXit-Frontend pairing-evidence/selection.json

      - name: Checkout backend test stack
        uses: actions/checkout@v4
        with:
          repository: makewaysdotnet/TranXIT-Backend
          ref: ${{ steps.backend-ref.outputs.sha }}
          path: TranXIT-Backend
          persist-credentials: false

      - name: Verify checkout and record exact pair
        run: node .github/scripts/ci-pair.mjs record pairing-evidence/selection.json makewaysdotnet/TranXit-Frontend . TranXIT-Backend pairing-evidence/source-pair.json

      - name: Verify Docker
        run: docker info

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start backend test stack
        run: |
          set +e
          npm run e2e:stack:up
          status=$?
          set -e

          if [ "$status" -eq 13 ]; then
            echo "::warning::Backend stack startup exited 13 after Compose startup; validating gateway readiness before failing."
            ready=false
            for attempt in $(seq 1 90); do
              if curl -fsS "$TRANXIT_API_URL/api/roles" >/dev/null; then
                echo "TranXIT E2E gateway is ready at $TRANXIT_API_URL"
                ready=true
                break
              fi
              echo "Waiting for TranXIT E2E gateway at $TRANXIT_API_URL ($attempt/90)"
              sleep 2
            done

            if [ "$ready" != "true" ]; then
              npm run e2e:stack:logs || true
              exit 1
            fi
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Lint
        run: npm run lint

      - name: Quote arithmetic and projection unit tests
        run: npm run test:unit

      - name: Build frontend for E2E
        run: npm run build:e2e

      - name: Run Playwright E2E
        run: npm run e2e:test

      - name: Backend stack diagnostics
        if: failure()
        run: |
          npm run e2e:stack:logs 2>&1 | tee e2e-stack-diagnostics.log || true
          echo "::group::docker version"
          { docker version || true; docker compose version || true; } 2>&1 | tee e2e-docker-version.log || true
          echo "::endgroup::"

      - name: Stop backend test stack
        if: always()
        run: npm run e2e:stack:down

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
            *.log
            ${{ env.TRANXIT_BACKEND_DIR }}/*.log
          if-no-files-found: ignore

      - name: Upload immutable source pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-source-pair-${{ github.run_attempt }}
          path: pairing-evidence/
          if-no-files-found: warn
          retention-days: 30
